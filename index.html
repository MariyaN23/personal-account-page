<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet">
  <title>Личный кабинет</title>
</head>
<body>
<script type="module" src="main.js"></script>
<div class="main-content">
  <header class="header">
    <img src="./assets/logo.png" alt="Логотип компании Лед-дисплей" class="header__logo">
    <h1 class="header__title">ООО «ОООЛЕД-дисплей»</h1>
  </header>
  <section class="overview">
    <div class="overview__stats">
      <img src="./assets/user-avatar.webp" alt="Константинопольский К." class="overview__avatar">
      <div class="overview__details">
        <div class="overview__user-info">
          <h2 class="overview__name">Константинопольский К.</h2>
          <p class="overview__position">супервайзер</p>
        </div>
        <div class="overview__status-wrapper">
          <span class="status status--active status--sm" aria-hidden="true"></span>
          <span class="overview__status">online</span>
        </div>
      </div>
    </div>
    <div class="overview__messages">
      <div class="overview__message-content">
        <h3 class="overview__messages-count">24 новых сообщения</h3>
        <p class="overview__alert">не забудьте проверить почту перед выходом</p>
      </div>
      <img src="./assets/alert.png" alt="Напоминание о проверке сообщений" class="overview__alert-icon">
    </div>
  </section>
  <section class="ads-manager">
    <header class="ads-manager__header">
      <p class="ads-manager__count">7 объявлений</p>
      <button class="ads-manager__add-btn" type="button">Добавить новое</button>
    </header>
    <table class="ads-table">
      <thead class="ads-table__head">
      <tr class="ads-table__row">
        <th class="ads-table__header"></th>
        <th class="ads-table__header">Фото и название</th>
        <th class="ads-table__header">Артикул</th>
        <th class="ads-table__header">Дата подачи</th>
        <th class="ads-table__header">Состояние</th>
        <th class="ads-table__header">Цена</th>
        <th class="ads-table__header">Статус</th>
        <th class="ads-table__header">Просмотры <br/>объявления</th>
        <th class="ads-table__header">Просмотры <br/>телефона</th>
        <th class="ads-table__header"></th>
      </tr>
      </thead>
      <tbody id="table-body" class="ads-table__body">
      </tbody>
    </table>
  </section>
  <div class="selection-panel">
    <div class="selection-panel__inner">
      <p class="selection-panel__placeholder">Выберите объявления</p>
      <div class="selection-panel__content">
        <p class="selection-panel__count">Выбрано 0 на странице</p>
        <div class="selection-panel__actions">
          <button class="selection-panel__action-btn" type="button">
            <span class="selection-panel__status status status--active status--base"></span>
            <span>Опубликовать</span>
          </button>
          <button class="selection-panel__action-btn" type="button">
            <span class="selection-panel__status status status--paused status--base"></span>
            <span>На паузу</span>
          </button>
          <button class="selection-panel__action-btn" type="button">
            <span class="selection-panel__status status status--delete status--base"></span>
            <span>Удалить</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
