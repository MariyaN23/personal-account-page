<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <title>Личный кабинет</title>
  </head>
  <body>
    <script type="module" src="main.js"></script>
    <div class="main-content">
      <header class="header">
        <img src="./assets/logo.png" alt="Логотип компании Лед-дисплей" class="header__logo">
        <h1 class="header__title">ООО «ОООЛЕД-дисплей»</h1>
      </header>
      <section class="overview">
        <div class="overview__stats">
          <img src="./assets/user-avatar.webp" alt="Константинопольский К." class="overview__avatar">
          <div class="overview__details">
            <div class="overview__user-info">
              <h2 class="overview__name">Константинопольский К.</h2>
              <p class="overview__position">супервайзер</p>
            </div>
            <div class="overview__status-wrapper">
              <span class="status status--active status--sm" aria-hidden="true"></span>
              <span class="overview__status">online</span>
            </div>
          </div>
        </div>
        <div class="overview__messages">
          <div class="overview__message-content">
            <h3 class="overview__messages-count">24 новых сообщения</h3>
            <p class="overview__alert">не забудьте проверить почту перед выходом</p>
          </div>
            <img src="./assets/alert.png" alt="Напоминание о проверке сообщений" class="overview__alert-icon">
        </div>
      </section>
    </div>
  </body>
</html>
